<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{{ page.title }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    {% if page.alternate_url %}
      <link rel="alternate" hreflang="{{ page.lang }}" href="{{ page.url | absolute_url }}">
      <link rel="alternate" hreflang="{% if page.lang == 'ko' %}en{% else %}ko{% endif %}" href="{{ page.alternate_url | absolute_url }}">
      <link rel="alternate" hreflang="x-default" href="{% if page.lang == 'ko' %}{{ page.alternate_url | absolute_url }}{% else %}{{ page.url | absolute_url }}{% endif %}">
    {% endif %}
    <meta property="og:type" content="{{ page.og_type | default: 'website' }}">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/images/profile.webp' | absolute_url }}">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% if page.person %}
      <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Person",
          "name": "Jaehyun Ha",
          "url": "{{ '/' | absolute_url }}",
          "image": "{{ '/assets/images/profile.webp' | absolute_url }}",
          "email": ["mailto:yshajae@postech.ac.kr", "mailto:jhha@dblab.postech.ac.kr"],
          "affiliation": {
            "@type": "CollegeOrUniversity",
            "name": "Pohang University of Science and Technology",
            "alternateName": "POSTECH"
          },
          "sameAs": [
            "https://scholar.google.com/citations?user=U6ZrhqwAAAAJ&hl=en",
            "https://github.com/githajae",
            "https://www.linkedin.com/in/jaehyun-ha-6351a2244/"
          ]
        }
      </script>
    {% endif %}
  </head>
  <body class="{{ page.body_class }}">
    <a class="skip-link" href="#main-content">{% if page.lang == 'ko' %}본문으로 이동{% else %}Skip to content{% endif %}</a>
    {{ content }}
  </body>
</html>
