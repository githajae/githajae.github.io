<body>
<header>
  <div>
    <h1>CADENZA · Multi-Objective Tuning</h1>
    <div class="sub">Bayesian optimization, walked through on the paper's running example</div>
  </div>
  <div class="nav">
    <button class="rbtn" id="prev" aria-label="previous">&#8249;</button>
    <span class="counter mono" id="counter"></span>
    <button class="rbtn" id="next" aria-label="next">&#8250;</button>
  </div>
</header>
<div class="dots" id="dots"></div>
<div class="stage"><div class="deck" id="deck"></div></div>

<div class="mbg" id="modal"><div class="mcard"><button class="mx" id="mx" aria-label="close">&#10005;</button><div id="mbody"></div></div></div>

<script>
"use strict";
/* ---------- subscript formatters (LaTeX-like) ---------- */
function subHTML(s){return s.replace(/([λτθ])_([a-z]+)(\d*)/g,(_,g,a,d)=>g+'<sub>'+a+(d?','+d:'')+'</sub>');}
function subSVG(s){return s.replace(/([λτθ])_([a-z]+)(\d*)/g,(_,g,a,d)=>g+'<tspan baseline-shift="sub" font-size="70%">'+a+(d?','+d:'')+'</tspan>');}

/* ---------- math helpers ---------- */
function erf(x){const t=1/(1+0.3275911*Math.abs(x));
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
  return x>=0?y:-y;}
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
const phi=z=>Math.exp(-z*z/2)/Math.sqrt(2*Math.PI);
function matInv(A){const n=A.length,M=A.map((r,i)=>r.concat(Array.from({length:n},(_,j)=>i===j?1:0)));
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;
    [M[c],M[p]]=[M[p],M[c]];const pv=M[c][c]||1e-9;for(let j=0;j<2*n;j++)M[c][j]/=pv;
    for(let r=0;r<n;r++){if(r===c)continue;const f=M[r][c];for(let j=0;j<2*n;j++)M[r][j]-=f*M[c][j];}}
  return M.map(r=>r.slice(n));}
function matVec(A,v){return A.map(r=>r.reduce((s,x,j)=>s+x*v[j],0));}

/* ---------- GP (1-D projection) ---------- */
const S2=0.06,L=0.16,SN2=0.0015;
const rbf=(a,b)=>S2*Math.exp(-((a-b)*(a-b))/(2*L*L));
function gp(X,Y,grid){
  const n=X.length,K=X.map((xi,i)=>X.map((xj,j)=>rbf(xi,xj)+(i===j?SN2:0)));
  const Ki=matInv(K),my=Y.reduce((s,v)=>s+v,0)/n,yc=Y.map(v=>v-my),al=matVec(Ki,yc);
  return grid.map(g=>{const ks=X.map(xi=>rbf(g,xi));
    const mean=my+ks.reduce((s,k,i)=>s+k*al[i],0);
    const v=S2-ks.reduce((s,k,i)=>s+k*matVec(Ki,ks)[i],0);
    return {x:g,mean,sd:Math.sqrt(Math.max(v,1e-5))};});}

/* ---------- evaluation model (6 validation labels) ----------
   Difficulty d is the router's cheap-feature score from TWO features:
   text length + keyword hit (an explicit, regex-registered claim phrase).
   Keyword presence dominates (it tells you a regex suffices); length only
   breaks ties among the no-keyword labels. The set is built so that
   length-alone mis-ranks #2 (long but cheap) and #3 (short but escalates). */
const SAMPLES=[
  {id:1,prefix:'"FDA approved…"',full:'"FDA approved."',
   len:2,kw:true,kwt:'✔ "FDA approved"',d:0.07,ans:'Yes',prod:{type:'bottle',color:'#cf9248',cap:'#a9712f'}},
  {id:2,prefix:'"Daily multivitamin…"',full:'"Daily multivitamin for immune support. Made in an FDA-registered, GMP-certified facility."',
   len:13,kw:true,kwt:'✔ "FDA-registered"',d:0.20,ans:'Yes',prod:{type:'bottle',color:'#5f9a7c',cap:'#3f6e58'}},
  {id:3,prefix:'"Approved…"',full:'"Approved."',
   len:1,kw:false,kwt:'✘ no registered keyword',d:0.38,ans:'Yes',prod:{type:'jar',color:'#d9cfe9',cap:'#b7a8d6'}},
  {id:4,prefix:'"Clinically proven…"',full:'"Clinically proven to reduce fine lines in 4 weeks."',
   len:9,kw:false,kwt:'✘ no registered keyword',d:0.50,ans:'Yes',prod:{type:'dropper',color:'#e6bd5a'}},
  {id:5,prefix:'"Helps maintain…"',full:'"Helps maintain overall wellness as part of a healthy, balanced daily lifestyle."',
   len:12,kw:false,kwt:'✘ no registered keyword',d:0.74,ans:'Yes',prod:{type:'tube',color:'#e7e0d2',cap:'#c9bfa9'}},
  {id:6,prefix:'"Trusted by…"',full:'"Trusted by professionals to support your immunity, energy, focus, and recovery every day."',
   len:13,kw:false,kwt:'✘ no registered keyword',d:0.86,ans:'Yes',prod:{type:'bottle',color:'#c98aa0',cap:'#a96a80'}}
];
const CAP={rule:0.25,local:0.62,llm:1.0};
const COST={rule:0.02,local:0.08,llm:0.50};
const LAT={rule:0.1,local:0.6,llm:3.0};
const LMAX=4.0,CMAX=0.7;
function routeOf(d,c1,c2){return d<c1?'rule':d<c2?'local':'llm';}
function evalAt(c1,c2){
  let ok=0,cost=0,lat=0;const route={rule:0,local:0,llm:0};const tuples=[];
  SAMPLES.forEach(s=>{const b=routeOf(s.d,c1,c2);route[b]++;cost+=COST[b];lat+=LAT[b];
    const good=s.d<=CAP[b];if(good)ok++;tuples.push({label:s.prefix,backend:b,ok:good});});
  const n=SAMPLES.length,Q=ok/n,C=cost/n,Lv=lat/n,U=Q-0.4*(Lv/LMAX)-0.3*(C/CMAX);
  return {Q,L:Lv,C,U,route,tuples};
}
/* 10 trials, each with milestone:detail + meaning. c1,c2 = OpTxtQA router breakpoints. */
const TRIALS=[
  {m:1,d:1,c1:0.70,c2:0.95,meaning:'Too-cheap split — only the two keyword labels land right; the other four mis-route.'},
  {m:1,d:2,c1:0.02,c2:0.05,meaning:'Everything to GPT-4 — all six correct, but maximal cost.'},
  {m:1,d:3,c1:0.45,c2:0.90,meaning:'Explore — keyword-free labels pushed too cheap; three still fail.'},
  {m:2,d:1,c1:0.05,c2:0.30,meaning:'First Q=1, but nothing on rule — four GPT-4 calls.'},
  {m:2,d:2,c1:0.30,c2:0.50,meaning:'Keyword labels now on rule; quality stays 1, still three GPT-4 calls.'},
  {m:3,d:1,c1:0.30,c2:0.62,meaning:'Sweet spot — rule / local / GPT-4 split matches the difficulty. Q=1 at low cost.'},
  {m:3,d:2,c1:0.30,c2:0.80,meaning:'Overreach — the long "Helps maintain…" label drops to local and fails.'},
  {m:3,d:3,c1:0.28,c2:0.64,meaning:'Back to the optimal split — Q=1 at low cost.'},
  {m:4,d:1,c1:0.30,c2:0.50,meaning:'Probe — a keyword-free label pushed up to GPT-4; costlier, dips slightly.'},
  {m:4,d:2,c1:0.30,c2:0.62,meaning:'Converged — keyword→rule, short no-keyword→local, long no-keyword→GPT-4. Q=1 at minimum cost.'}
];
const MET=TRIALS.map(t=>evalAt(t.c1,t.c2));
const BEST=MET.map((_,i)=>Math.max(...MET.slice(0,i+1).map(m=>m.U)));
const Uarr=MET.map(m=>m.U), Xarr=TRIALS.map(t=>t.c2);
function colU(u){const t=Math.max(0,Math.min(1,u/0.72));const a=[210,210,215],b=[10,122,92];
  return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';}
/* candidate view: GP over c2 of past trials predicts U for candidate configs; EI ranks them */
function candidates(ti){
  const X=Xarr.slice(0,ti+1),Y=Uarr.slice(0,ti+1);
  const grid=[0.12,0.25,0.40,0.55,0.70,0.82,0.93];
  const post=gp(X,Y,grid),yb=Math.max(...Y);
  const c=post.map(p=>{const z=(p.mean-yb-0.005)/p.sd;const ei=p.sd>1e-5?Math.max(0,(p.mean-yb-0.005)*Phi(z)+p.sd*phi(z)):0;
    return {mean:p.mean,sd:p.sd,ei};});
  c.sort((a,b)=>b.ei-a.ei);return c;
}

/* ---------- operator definitions ---------- */
const OPDEF={
  OpImgObj:{title:'OpImgObj(Image)',out:'Score (object present)',input:'product image (RGB)',
    features:['resolution','scene clutter'],
    backends:[{f:'rule-based',s:'HSV heuristic',p:'—'},
      {f:'local model',s:'YOLO-World',p:'θ_obj (min_score)'},
      {f:'LLM',s:'GPT-4V',p:'—'}],

const L2D=0.28;
function gp2d(P,Y,grid){
  const n=P.length;
  const k=(a,b)=>{const dx=a[0]-b[0],dy=a[1]-b[1];return S2*Math.exp(-(dx*dx+dy*dy)/(2*L2D*L2D));};
  const K=P.map((pi,i)=>P.map((pj,j)=>k(pi,pj)+(i===j?SN2:0)));
  const Ki=matInv(K),my=Y.reduce((s,v)=>s+v,0)/n,yc=Y.map(v=>v-my),al=matVec(Ki,yc);
  return grid.map(g=>{const ks=P.map(pi=>k(g,pi));const Kiks=matVec(Ki,ks);
    const mean=my+ks.reduce((s,kk,i)=>s+kk*al[i],0);
    const v=S2-ks.reduce((s,kk,i)=>s+kk*Kiks[i],0);
    return {mean,sd:Math.sqrt(Math.max(v,1e-5))};});
}
function ramp(t,S){t=Math.max(0,Math.min(1,t));
  for(let i=1;i<S.length;i++){if(t<=S[i][0]){const p=S[i-1],q=S[i],u=(t-p[0])/((q[0]-p[0])||1);
    return 'rgb('+[0,1,2].map(k=>Math.round(p[1][k]+(q[1][k]-p[1][k])*u)).join(',')+')';}}
  return 'rgb('+S[S.length-1][1].join(',')+')';}

  ];
  let ops='';plan.forEach((o,i)=>{
    ops+='<div class="op '+o.k+(o.op?' clk" data-op="'+o.op+'"':'"')+'>'+subHTML(o.l)+(o.op?'<span class="mag">⌕</span>':'')+'</div>';
    if(i<plan.length-1)ops+='<div class="up">↑</div>';});
  return '<div class="stage-label">Card 2 · Physical Plan</div><h2>Plan A&#8242;</h2>'
    +'<div class="planhint" style="margin-bottom:14px">Click a task operator (green) to open its router structure</div>'
    +'<div style="display:flex;flex-direction:column;gap:5px;max-width:430px;margin-left:auto;margin-right:auto">'+ops+'</div>';
}
function cardParams(){
  const rows=PARAM_ROWS.map(r=>{
    const chips=r.ps.map(n=>'<span class="pchip2" data-p="'+n+'">'+subHTML(n)+'</span>').join('');
    return '<div class="prow2"><span class="opbox'+(r.rel?' rel':'')+'">'+subHTML(r.op)+'</span><span class="conn">—</span><span class="chips2">'+chips+'</span></div>';
  }).join('');
  return '<div class="stage-label">Card 3 · Search space</div><h2>Operator — Parameters</h2>'
    +'<p class="lede">Each operator compiles into a router + 3 backends. The only tunable knobs are breakpoints <b>τ</b>, the local-model threshold <b>θ</b>, and the output threshold <b>λ</b> (LLM and rule-based expose none). Relational σ filters carry their own λ. Click a chip for its description.</p>'
    +'<div style="margin-top:18px">'+rows+'</div>'
    +'<div id="pdesc" class="pdesc">Click a parameter chip to see its description.</div>';
}
function cardSpace(){
  const rows=PARAM_ROWS.map(r=>{
    const chips=r.ps.map(n=>'<span class="spchip">'+subHTML(n)+' <span class="dom">∈ '+DOMAIN[n]+'</span></span>').join('');
    return '<div class="prow2"><span class="opbox'+(r.rel?' rel':'')+'">'+subHTML(r.op)+'</span><span class="conn">—</span><span class="chips2">'+chips+'</span></div>';
  }).join('');
  return '<div class="stage-label">Card 4 · What BO optimizes</div><h2>Search space &amp; objective</h2>'
    +'<div class="bl-h" style="margin-top:2px">X · Parameter space &nbsp;θ ∈ ℝ¹¹ <span class="bl-sub">— breakpoints τ are percentiles with τ&#8321; &lt; τ&#8322;</span></div>'
    +'<div style="margin-top:8px">'+rows+'</div>'
    +'<div class="bigblock" style="margin-top:16px"><div class="bl-h">Y · Objective &nbsp;U <span class="bl-sub">— BO maximizes this</span></div>'
      +'<div class="bl-eq mono">U = Q − 0.4·L&#770; − 0.3·C&#770;</div>'
      +'<div class="bl-note">Q = quality (↑) &nbsp;·&nbsp; L&#770; = latency, log-normalized (↓) &nbsp;·&nbsp; C&#770; = cost, log-normalized (↓)</div></div>';
}
function cardSettings(){
  const row=(k,v)=>'<div class="setrow"><span class="setk">'+k+'</span><span class="setv">'+v+'</span></div>';
  return '<div class="stage-label">Card 5 · BO settings</div><h2>How BO runs</h2>'
    +'<div style="margin-top:8px">'
    +row('Surrogate','Gaussian Process — predicts U and its uncertainty at any θ <span class="eqn">(Eq. 8–9)</span>')
    +row('Acquisition','q-Expected Improvement — balances mean (exploit) vs uncertainty (explore) to pick the next θ <span class="eqn">(Eq. 20)</span>')
    +row('Sample size','6-label validation set; each trial = one noisy observation <span class="eqn">(§5.2)</span>')
    +row('Loop','fit GP → maximize qEI → evaluate U → update, repeated over a 10-trial budget <span class="eqn">(Algorithm 1)</span>')
    +'</div>';
}
function cardOverview(){
  const ms=[
    ['M1','Explore','Probe the extremes — all-cheap vs all-GPT-4 — and learn which tuples truly need which backend.'],
    ['M2','Lock Q = 1','Find a configuration where every tuple is answered correctly (still costly).'],
    ['M3','Cut cost','Keep Q = 1 while moving easy / medium tuples to cheaper backends, trial by trial.'],
    ['M4','Converge','Settle at Q = 1 with minimum cost — only the genuinely hard tuples use GPT-4.']
  ];
  const rows=ms.map(x=>'<div class="setrow"><span class="setk"><span style="color:var(--blue)">'+x[0]+'</span> · '+x[1]+'</span><span class="setv">'+x[2]+'</span></div>').join('');
  return '<div class="stage-label">Card 6 · BO milestones</div><h2>How the 10-trial run unfolds</h2>'
    +'<p class="lede">The next cards step through 10 trials, each labelled <b>M{milestone} : {detail}</b>. <b>For clarity, from here on we focus on the single most important operator (OpTxtQA) and its two key parameters — the router breakpoints τ<sub>qa,1</sub> and τ<sub>qa,2</sub></b> — evaluated over the 6 validation labels. The full system tunes all 11 parameters across the plan.</p>'
    +'<div style="margin-top:10px">'+rows+'</div>';
}
function cardTrial(ti){
  const t=TRIALS[ti],m=MET[ti],isBest=Math.abs(m.U-BEST[ti])<1e-9;
  const vt=(l,v,u)=>'<div class="tile'+(u?' u':'')+'" style="display:flex;justify-content:space-between;align-items:center;padding:7px 11px"><span class="l" style="font-size:11px">'+l+'</span><span class="v" style="font-size:14.5px">'+v+'</span></div>';
  const lg=(sw,tx)=>'<div style="display:flex;align-items:center;gap:6px">'+sw+'<span>'+tx+'</span></div>';
  const legend='<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:11px;color:var(--muted)">'
    +lg('<span style="flex:0 0 20px;height:0;border-top:2.5px solid #0a7a5c"></span>','surrogate mean')
    +lg('<span style="flex:0 0 20px;height:10px;border-radius:3px;background:rgba(10,122,92,0.18)"></span>','uncertainty band')
    +lg('<span style="flex:0 0 20px;text-align:center"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#0a7a5c"></span></span>','evaluated trial')
    +lg('<span style="flex:0 0 20px;height:10px;border-radius:3px;background:linear-gradient(90deg,#fdf7e9,#e0962e,#784408)"></span>','EI (low → high)')
    +lg('<span style="flex:0 0 20px;text-align:center"><span style="display:inline-block;width:9px;height:9px;background:#c4342f;transform:rotate(45deg)"></span></span>','next (EI argmax)')
    +lg('<span style="flex:0 0 20px;text-align:center"><span style="display:inline-block;width:14px;height:0;border-top:2px dashed #c4342f"></span></span>','next, on surrogate')
    +'</div>';
  return '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:20px">'
      +'<div><div class="stage-label">M'+t.m+' : '+t.d+' · BO trial</div><h2 style="margin-bottom:2px">BO Trial '+(ti+1)+'</h2></div>'
      +'<div style="flex:0 0 290px;margin-top:-10px"><div class="zt">How to read</div>'+legend+'</div>'
    +'</div>'
    +'<div style="display:flex;gap:16px;align-items:flex-start;margin-top:8px">'
      +'<div style="flex:1"><div class="zt">① Surrogate — mean ± uncertainty</div>'
        +svgSurrogate1D(ti,0)+'<div style="height:6px"></div>'+svgSurrogate1D(ti,1)+'</div>'
      +'<div style="flex:1"><div class="zt">② Acquisition (EI)</div>'+contourSVG(ti,'EI',225)+'</div>'
      +'<div style="flex:0 0 124px"><div class="zt">③ This trial</div>'
        +'<div style="display:flex;flex-direction:column;gap:7px">'
          +vt('Quality',m.Q.toFixed(2))+vt('Latency',m.L.toFixed(1))+vt('Cost',m.C.toFixed(2))+vt('Utility',m.U.toFixed(2),true)
        +'</div></div>'
    +'</div>'
    +'<div class="zt" style="margin-top:12px">④ Utility — best-so-far</div>'+svgConv(ti)
    +'<div class="zt" style="margin-top:12px">⑤ Per-data result · 6 labels</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 24px">'+tuples5(m)+'</div>'
    +'<div class="meaning"><b>⑥ Meaning</b> — '+t.meaning+'</div>';
}

/* ---------- interaction card (per-trial routing of the 6 labels) ---------- */
function defaultSel(ti){const t=TRIALS[ti];
  for(const sp of SAMPLES){const b=routeOf(sp.d,t.c1,t.c2);if(sp.d>CAP[b])return sp.id;}
  return 2; /* no failure → showcase the "long but easy" label */
}
function iaxisSVG(ti,selId){
  const t=TRIALS[ti],c1=t.c1,c2=t.c2;
  const W=632,H=96,x0=22,bw=W-44,y=46,h=30;
  const x1=x0+bw*c1,x2=x0+bw*c2;
  let s='<text x="'+x0+'" y="13" style="font-size:10.5px;fill:#6e6e73">difficulty d  (length + keyword → score) · dot = label · green ✓ / red ✗</text>';
  s+='<rect x="'+x0+'" y="'+y+'" width="'+(bw*c1)+'" height="'+h+'" fill="#f0f0f2"/>'
    +'<rect x="'+x1+'" y="'+y+'" width="'+(bw*(c2-c1))+'" height="'+h+'" fill="#e4f5ee"/>'
    +'<rect x="'+x2+'" y="'+y+'" width="'+(bw*(1-c2))+'" height="'+h+'" fill="#eaf3fd"/>'
    +'<rect x="'+x0+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="6" fill="none" stroke="#d2d2d7"/>';
  const zlab=(cx,w,col,txt)=>w>58?'<text x="'+cx+'" y="'+(y+h+15)+'" text-anchor="middle" style="font-size:10.5px;fill:'+col+';font-weight:600">'+txt+'</text>':'';
  s+=zlab(x0+bw*c1/2,bw*c1,'#52525a','rule · regex')
    +zlab((x1+x2)/2,bw*(c2-c1),'#0a7a5c','local · DistilBERT')
    +zlab(x2+bw*(1-c2)/2,bw*(1-c2),'#185fa5','LLM · GPT-4');
  const close=(x2-x1)<58;
  const cut=(x,lab,anc)=>'<line x1="'+x+'" y1="'+(y-11)+'" x2="'+x+'" y2="'+(y+h+3)+'" stroke="#c4342f" stroke-width="1.4" stroke-dasharray="4 2"/>'
    +'<text x="'+(x+(anc==='end'?-3:anc==='start'?3:0))+'" y="'+(y-14)+'" text-anchor="'+anc+'" style="font-size:10px;fill:#c4342f;font-weight:600">'+lab+'</text>';
  s+=cut(x1,'c₁='+c1.toFixed(2),close?'end':'middle')+cut(x2,'c₂='+c2.toFixed(2),close?'start':'middle');
  s+='<text x="'+x0+'" y="'+(y-3)+'" style="font-size:9.5px;fill:#86868b">easy</text>'
    +'<text x="'+(x0+bw)+'" y="'+(y-3)+'" text-anchor="end" style="font-size:9.5px;fill:#86868b">hard</text>';
  SAMPLES.forEach(sp=>{const b=routeOf(sp.d,c1,c2),ok=sp.d<=CAP[b];const cx=x0+bw*sp.d;const col=ok?'#0a7a5c':'#c4342f';
    const r=sp.id===selId?7.5:5.4;
    s+='<circle cx="'+cx+'" cy="'+(y+h/2)+'" r="'+r+'" fill="'+col+'" stroke="#fff" stroke-width="1.7"/>'
      +'<text x="'+cx+'" y="'+(y+h/2+3)+'" text-anchor="middle" style="font-size:8.5px;fill:#fff;font-weight:700">'+sp.id+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+s+'</svg>';
}
const IBK={rule:['#52525a','#f0f0f2','rule'],local:['#0a7a5c','#e4f5ee','local'],llm:['#185fa5','#eaf3fd','GPT-4']};
function iitems(ti,selId){
  const t=TRIALS[ti];
  return SAMPLES.map(sp=>{const b=routeOf(sp.d,t.c1,t.c2),ok=sp.d<=CAP[b],c=IBK[b];
    return '<div class="iitem'+(sp.id===selId?' on':'')+'" data-it="'+sp.id+'"><span class="ibadge">'+sp.id+'</span>'
      +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+sp.prefix+'</span>'
      +'<span class="chip" style="background:'+c[1]+';color:'+c[0]+';justify-self:start">'+c[2]+'</span>'
      +'<span style="color:'+(ok?'#0a7a5c':'#c4342f')+';font-weight:700">'+(ok?'✓':'✗')+'</span></div>';}).join('');
}
function idetail(ti,selId){
  const t=TRIALS[ti],sp=SAMPLES.find(x=>x.id===selId);
  const b=routeOf(sp.d,t.c1,t.c2),ok=sp.d<=CAP[b],c={rule:['#52525a','#f0f0f2','rule · regex'],local:['#0a7a5c','#e4f5ee','local · DistilBERT'],llm:['#185fa5','#eaf3fd','LLM · GPT-4']}[b];
  const dec=sp.d<t.c1?'d &lt; c₁  →  rule':(sp.d<t.c2?'c₁ ≤ d &lt; c₂  →  local':'d ≥ c₂  →  GPT-4');
  return '<div class="dh">'+sp.full+'</div>'
    +'<div class="frow"><span class="fk">length</span><span class="fv">'+sp.len+' words</span></div>'
    +'<div class="frow"><span class="fk">keyword</span><span class="fv">'+sp.kwt+'</span></div>'
    +'<div class="frow"><span class="fk">→ difficulty d</span><span class="fv" style="color:#185fa5;font-weight:700">'+sp.d.toFixed(2)+'</span></div>'
    +'<div class="iflow"><span class="ipill" style="background:#fdecec;color:#c4342f">'+dec+'</span></div>'
    +'<div class="iflow"><span style="color:#86868b">routed to</span><span class="ipill" style="background:'+c[1]+';color:'+c[0]+'">'+c[2]+'</span>'
      +'<span style="color:'+(ok?'#0a7a5c':'#c4342f')+';font-weight:700">'+(ok?'✓ correct':'✗ wrong')+'</span></div>'
    +'<div class="iflow"><span style="color:#86868b">ground truth:</span><span style="font-weight:600">claim = '+sp.ans+'</span></div>';
}
function cardInteract(ti){
  const t=TRIALS[ti],sel=defaultSel(ti);
  return '<div class="stage-label">M'+t.m+' : '+t.d+' · routing</div>'
    +'<h2 style="margin-bottom:3px">How the 6 labels route <span class="meta" style="color:#86868b">— Trial '+(ti+1)+' · c₁='+t.c1.toFixed(2)+', c₂='+t.c2.toFixed(2)+'</span></h2>'
    +'<p class="lede" style="margin-bottom:4px">The router turns each label’s two cheap features (length + keyword) into one difficulty <b>d</b>; this trial’s breakpoints then send it to rule / local / GPT-4. <b>Click a label</b> to see why it lands where it does.</p>'
    +'<div class="iax" id="iax-'+ti+'">'+iaxisSVG(ti,sel)+'</div>'
    +'<div class="iact-wrap" data-ti="'+ti+'">'
      +'<div class="iact-list" id="ilist-'+ti+'">'+iitems(ti,sel)+'</div>'
      +'<div class="idet" id="idet-'+ti+'">'+idetail(ti,sel)+'</div>'
    +'</div>';
}

/* ---------- deck + nav ---------- */
const cards=[cardQuery,cardPlan,cardParams,cardSpace,cardSettings,cardOverview];
for(let i=0;i<TRIALS.length;i++){const k=i;cards.push(()=>cardTrial(k));cards.push(()=>cardInteract(k));}
const deck=document.getElementById('deck');
const els=cards.map(fn=>{const d=document.createElement('div');d.className='card';d.innerHTML=fn();deck.appendChild(d);return d;});
let cur=0;
function layout(){
  els.forEach((el,i)=>{const dx=i-cur,ax=Math.abs(dx);let tx,sc,op,z;
    if(dx===0){tx=0;sc=1;op=1;z=5;}else if(ax===1){tx=dx*580;sc=0.84;op=0.32;z=3;}else{tx=dx*580;sc=0.72;op=0;z=1;}
    el.style.transform='translate(-50%,-50%) translateX('+tx+'px) scale('+sc+')';
    el.style.opacity=op;el.style.pointerEvents=dx===0?'auto':'none';el.style.zIndex=z;});
  document.getElementById('counter').textContent=(cur+1)+' / '+cards.length;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===cards.length-1;
  [...document.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===cur));
}
const dots=document.getElementById('dots');
cards.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>{cur=i;layout();fitStage();};dots.appendChild(d);});
document.getElementById('next').onclick=()=>{if(cur<cards.length-1){cur++;layout();fitStage();}};
document.getElementById('prev').onclick=()=>{if(cur>0){cur--;layout();fitStage();}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click();});

const modal=document.getElementById('modal'),mbody=document.getElementById('mbody');
function openModal(k){mbody.innerHTML=modalContent(k);modal.classList.add('show');}
function closeModal(){modal.classList.remove('show');}
document.getElementById('mx').onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
function renderQ(){const st=document.getElementById('qstage');if(!st)return;
  st.innerHTML=qSlide(qi);document.getElementById('qdots').innerHTML=qDots();}
deck.addEventListener('click',e=>{
  const qn=e.target.closest('[data-qd]');if(qn){qi=(qi+(+qn.getAttribute('data-qd'))+SAMPLES.length)%SAMPLES.length;renderQ();return;}
  const qd=e.target.closest('.qdot');if(qd){qi=+qd.getAttribute('data-qi');renderQ();return;}
  const it=e.target.closest('.iitem');if(it){const wrap=it.closest('.iact-wrap');const ti=+wrap.getAttribute('data-ti');const id=+it.getAttribute('data-it');
    document.getElementById('iax-'+ti).innerHTML=iaxisSVG(ti,id);
    document.getElementById('ilist-'+ti).innerHTML=iitems(ti,id);
    document.getElementById('idet-'+ti).innerHTML=idetail(ti,id);return;}
  const opEl=e.target.closest('[data-op]');if(opEl){openModal(opEl.getAttribute('data-op'));return;}
  const ch=e.target.closest('.pchip2');if(ch){
    [...document.querySelectorAll('.pchip2')].forEach(c=>c.classList.remove('on'));ch.classList.add('on');
    const n=ch.getAttribute('data-p');document.getElementById('pdesc').innerHTML='<b>'+subHTML(n)+'</b> — '+subHTML(PARAM_DESC[n]);return;}
});
const stageEl=document.querySelector('.stage');
function fitStage(){let mh=0;els.forEach(el=>{mh=Math.max(mh,el.offsetHeight);});stageEl.style.height=(mh+44)+'px';}
window.addEventListener('resize',fitStage);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
layout();fitStage();
</script>
</body>
</html>
